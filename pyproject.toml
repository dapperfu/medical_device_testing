[project]
name = "medical_device_testing"
version = "0.1.0"
description = "Mock vital-signs patient monitor and pytest harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-html>=4.1",
    "ruff>=0.6",
    "strictdoc==0.30.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_device_testing"]

[tool.pytest.ini_options]
addopts = "--html=docs/pytest-report.html --self-contained-html"
testpaths = ["tests/unit", "tests/integration", "tests/system"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
